
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">FORM<span>FOR RICHWELLIAN</span></div>
        <p>RICHWELL COLLEGES INCORPORATED</p>
    </header>

    <main class="container">

        <div class="page-heading">
            <h1>Student Management System</h1>
            <p>Welcome to RCI student</p>
        </div>

        <section class="form-card">
            <h2 id="formTitle">Add New Student</h2>

            <form id="studentForm">
                <input type="hidden" id="editIndex" value="-1">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course / Program</label>
                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option value="BSIS">BSIS</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                        <option value="BSEMC">BSTM</option>
                        
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="saveButton" class="btn-save">
                        Add Student
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="btn-cancel"
                        hidden
                    >
                        Cancel
                    </button>
                </div>
            </form>

            <p id="message" class="message" role="status"></p>
        </section>

        <section class="table-card">
            <h2>Student Records</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                        <!-- Student records appear here -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage">No student records yet.</p>
        </section>

    </main>

    <footer>
        <p>Student Management System &copy; 2026</p>
    </footer>

    <script src="javs.js"></script>
</body>
</html>
